site_name: EbreSafe - Projecte Intermodular
site_description: Documentació del projecte intermodular EbreSafe - Eina d'auditoria de seguretat de xarxa amb alta disponibilitat
site_author: Jordi Cervantes
site_url: https://jordicerv.github.io/projecte_ebresafe/

theme:
  name: material
  language: ca
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Canvia a mode fosc
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Canvia a mode clar
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/jordicerv/projecte_ebresafe
repo_name: jordicerv/projecte_ebresafe

nav:
  - Inici: index.md
  - Presentació:
    - Descripció del projecte: presentacio/descripcio.md
    - Objectius: presentacio/objectius.md
    - Equip: presentacio/equip.md
    - Enllaços: presentacio/enllacos.md
  - Laboratori:
    - Muntatge del laboratori: laboratori/muntatge.md
    - Servidor secundari: laboratori/servidor_secundari.md
    - Serveis comuns: laboratori/serveis_comuns.md
    - Vulnerabilitats: laboratori/vulnerabilitats.md
    - Keepalived i failover: laboratori/keepalived.md
    - Serveis extra: laboratori/serveis_extra.md
    - Verificació: laboratori/verificacio.md
  - Alta Disponibilitat:
    - Visió general: ha/index.md
    - SSH: ha/ssh.md
    - HTTP: ha/http.md
    - MariaDB: ha/mariadb.md
    - DNS: ha/dns.md
    - FTP: ha/ftp.md
    - Samba: ha/samba.md
    - Scripts de sincronització: ha/scripts.md
    - Prova final: ha/prova_final.md
  - Eina d'Auditoria:
    - Descripció general: auditoria/descripcio.md
    - Estructura i funcionalitats: auditoria/estructura.md
    - Ús de l'eina: auditoria/us.md
    - Telegram: auditoria/telegram.md
    - Docker i USB: auditoria/docker.md
    - Problemes i solucions: auditoria/problemes.md
    - Captures de pantalla: auditoria/captures.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jordicerv
